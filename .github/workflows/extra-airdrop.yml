name: extra-airdrop
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  pay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install ethers@6.13.5
      - run: node scripts/extra-airdrop.mjs
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BSC_RPC: https://bsc-dataseed.binance.org
