name: Snapshot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: snapshot-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ethers
        run: npm install ethers@6.13.5
      - name: Pull on-chain snapshot
        run: node scripts/snapshot.mjs
        env:
          BSC_RPC: https://bsc-rpc.publicnode.com
          SETTLE_CATCHUP: "250"
          BURN_CATCHUP: "250"
      - name: Commit snapshot
        run: |
          rm -rf node_modules package-lock.json
          if [ -f package.json ] && ! git ls-files --error-unmatch package.json >/dev/null 2>&1; then
            rm -f package.json
          fi
          git add data/snapshot.json data/board-wallets.json data/v5-history.json data/admin-board.json
          if git diff --staged --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git -c user.name="CatboxRun" -c user.email="CatboxRun@users.noreply.github.com" commit -m "Refresh on-chain snapshot."
          git pull --rebase origin main
          git push
        env:
          GIT_AUTHOR_NAME: CatboxRun
          GIT_AUTHOR_EMAIL: CatboxRun@users.noreply.github.com
          GIT_COMMITTER_NAME: CatboxRun
          GIT_COMMITTER_EMAIL: CatboxRun@users.noreply.github.com
